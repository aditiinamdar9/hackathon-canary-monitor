<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canary Monitor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #11121b;
            color: #f3f1ff;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 20px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #37394f;
            background: #171824;
        }

        header h2 {
            margin: 0;
            color: #b8a7ff;
            letter-spacing: 2px;
        }

        header span {
            color: #aaaabd;
            font-size: 13px;
        }

        main {
            width: min(1000px, 90%);
            margin: 50px auto;
        }

        .status {
            color: #b8a7ff;
            font-weight: bold;
            text-transform: uppercase;
        }

        h1 {
            margin: 15px 0;
            font-size: clamp(42px, 7vw, 65px);
        }

        .description {
            max-width: 650px;
            color: #b6b6c8;
            line-height: 1.6;
        }

        .cards {
            margin-top: 35px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .card {
            padding: 22px;
            border: 1px solid #37394f;
            border-radius: 10px;
            background: #1c1e2d;
        }

        .card span {
            display: block;
            color: #aaaabd;
            font-size: 12px;
            text-transform: uppercase;
        }

        .card strong {
            display: block;
            margin-top: 10px;
            font-size: 25px;
        }

        .event {
            margin-top: 15px;
            padding: 25px;
            border: 1px solid #37394f;
            border-radius: 10px;
            background: #1c1e2d;
        }

        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .event-header h2 {
            margin: 0;
        }

        .risk {
            padding: 6px 10px;
            border-radius: 6px;
            color: #b8a7ff;
            background: #b8a7ff18;
            font-size: 12px;
            font-weight: bold;
        }

        .file {
            margin-top: 20px;
            padding: 15px;
            border-radius: 7px;
            background: #151621;
        }

        .file span,
        .file strong {
            display: block;
        }

        .file span {
            color: #aaaabd;
            font-size: 11px;
        }

        .file strong {
            margin-top: 7px;
            overflow-wrap: anywhere;
        }

        .details {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .detail span,
        .detail strong {
            display: block;
        }

        .detail span {
            margin-bottom: 7px;
            color: #aaaabd;
            font-size: 11px;
        }

        .detail strong {
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .threat .status {
            color: #ff8098;
        }

        .threat .risk {
            color: #ff8098;
            background: #ff809818;
        }

        @media (max-width: 700px) {
            .cards,
            .details {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>
    <header>
        <h2>CANARY MONITOR</h2>
        <span>● Live monitoring</span>
    </header>

    <main id="dashboard">
        <section>
            <div id="status" class="status">System protected</div>

            <h1 id="headline">No threats detected.</h1>

            <p id="description" class="description">
                The system is monitoring the sandbox for changes to the canary
                files.
            </p>
        </section>

        <section class="cards">
            <div class="card">
                <span>Protected files</span>
                <strong>5</strong>
            </div>

            <div class="card">
                <span>Risk score</span>
                <strong id="risk-score">0 / 100</strong>
            </div>

            <div class="card">
                <span>Monitor</span>
                <strong>Online</strong>
            </div>
        </section>

        <section class="event">
            <div class="event-header">
                <h2 id="event-title">Latest event</h2>
                <span id="risk-label" class="risk">Clear</span>
            </div>

            <div class="file">
                <span>Affected file</span>
                <strong id="file-path">No file changes detected</strong>
            </div>

            <div class="details">
                <div class="detail">
                    <span>Action</span>
                    <strong id="action">—</strong>
                </div>

                <div class="detail">
                    <span>Time</span>
                    <strong id="timestamp">—</strong>
                </div>

                <div class="detail">
                    <span>Process</span>
                    <strong id="process">—</strong>
                </div>

                <div class="detail">
                    <span>PID</span>
                    <strong id="pid">—</strong>
                </div>
            </div>
        </section>
    </main>

    <script>
        function showProtected() {
            const dashboard = document.getElementById("dashboard");

            dashboard.classList.remove("threat");

            document.getElementById("status").textContent =
                "System protected";

            document.getElementById("headline").textContent =
                "No threats detected.";

            document.getElementById("description").textContent =
                "The system is monitoring the sandbox for changes to the canary files.";

            document.getElementById("risk-score").textContent =
                "0 / 100";

            document.getElementById("risk-label").textContent =
                "Clear";
        }

        function showThreat(event) {
            const dashboard = document.getElementById("dashboard");
            const suspects = event.suspect_processes || [];
            const suspect = suspects.length ? suspects[0] : {};
            const risk = event.risk_score || 60;

            dashboard.classList.add("threat");

            document.getElementById("status").textContent =
                "Threat detected";

            document.getElementById("headline").textContent =
                "A canary file was changed.";

            document.getElementById("description").textContent =
                "The monitor confirmed that a protected file was modified.";

            document.getElementById("risk-score").textContent =
                risk + " / 100";

            document.getElementById("risk-label").textContent =
                risk >= 85 ? "Critical" : "Elevated";

            document.getElementById("event-title").textContent =
                "Confirmed tampering";

            document.getElementById("file-path").textContent =
                event.path || "Unknown file";

            document.getElementById("action").textContent =
                event.action || "Unknown";

            document.getElementById("timestamp").textContent =
                event.timestamp
                    ? new Date(event.timestamp).toLocaleTimeString()
                    : "Unknown";

            document.getElementById("process").textContent =
                suspect.name || "Not identified";

            document.getElementById("pid").textContent =
                suspect.pid || "Not identified";
        }

        async function updateDashboard() {
            try {
                const response = await fetch("/api/latest-event");
                const data = await response.json();

                if (data.status === "threat" && data.event) {
                    showThreat(data.event);
                } else {
                    showProtected();
                }
            } catch (error) {
                console.log("Waiting for monitor...");
            }
        }

        updateDashboard();
        setInterval(updateDashboard, 1000);
    </script>
</body>
</html>
